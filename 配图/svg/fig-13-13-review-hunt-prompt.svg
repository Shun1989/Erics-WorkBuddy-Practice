<text x="80.0" y="273.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#E0A95C" text-anchor="start" font-weight="bold">【输出格式】每条一行，格式固定，不许改：</text>
<text x="80.0" y="292.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">编号 | 类别 | 一句话问题描述 | 涉及文件与页码 | 原文引用（40 字以内） | 把握（高/中/低）</text>
<text x="80.0" y="311.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal"></text>
<text x="80.0" y="330.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">【纪律】</text>
