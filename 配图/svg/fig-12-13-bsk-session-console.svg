<text x="56.0" y="58.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="27" fill="#1C2026" text-anchor="start" font-weight="bold">会话四步与收尾动作：开会话、跑完查会话、停会话、查活跃</text>
<text x="56.0" y="88.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#6B7280" text-anchor="start" font-weight="normal">场景 31 操作步骤与验收标准第五条，命令与现象均取自正文</text>
<line x1="56" y1="106" x2="944" y2="106" stroke="#E5E1DA" stroke-width="1.5"/>
<text x="56.0" y="596.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#6B7280" text-anchor="start" font-weight="normal">翻车一是扩展没装或装了没启用，症状就是 bsk session start 直接报连不上，或者会话起来了但窗口里一片空白。补救是先在浏览器扩展管理页确认</text>
<text x="56.0" y="616.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#6B7280" text-anchor="start" font-weight="normal">扩展处于启用状态。</text>
<rect x="56.0" y="128.0" width="888.0" height="420.0" rx="10" fill="#1C2026" stroke="#3A4049" stroke-width="1.5"/>
<path d="M66,162 L934,162" stroke="#3A4049" stroke-width="1"/>
<circle cx="76" cy="145" r="5" fill="#E05C5C"/>
<circle cx="92" cy="145" r="5" fill="#E0A95C"/>
<circle cx="108" cy="145" r="5" fill="#5CB87C"/>
<text x="500.0" y="150.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#E5E1DA" text-anchor="middle" font-weight="bold">终端  ·  bash</text>
<text x="78.0" y="176.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="14" fill="#8A9099" text-anchor="start" font-weight="normal"># 扩展必须你本人在浏览器里点安装，AI 替不了这一步</text>
<text x="78.0" y="200.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="14" fill="#E0A95C" text-anchor="start" font-weight="bold">$</text>
<text x="96.0" y="200.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="14" fill="#FAFAF8" text-anchor="start" font-weight="normal"> bsk version</text>
<text x="78.0" y="224.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="14" fill="#7FC48B" text-anchor="start" font-weight="normal">0.9.3</text>
<text x="78.0" y="248.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="14" fill="#8A9099" text-anchor="start" font-weight="normal"></text>
<text x="78.0" y="272.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="14" fill="#E0A95C" text-anchor="start" font-weight="bold">$</text>
<text x="96.0" y="272.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="14" fill="#FAFAF8" text-anchor="start" font-weight="normal"> bsk session start</text>
<text x="78.0" y="296.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="14" fill="#7FC48B" text-anchor="start" font-weight="normal">[会话] session 已建立，编号 a7f3，隔离窗口已打开。</text>
<text x="78.0" y="320.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="14" fill="#8A9099" text-anchor="start" font-weight="normal">（此时把你正在用的那些窗口留着别动，它在旁边另开一个窗口跑）</text>
<text x="78.0" y="344.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="14" fill="#8A9099" text-anchor="start" font-weight="normal"></text>
<text x="78.0" y="368.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="14" fill="#8A9099" text-anchor="start" font-weight="normal"># 活干完立刻停，并手动关掉那个 Agent 窗口</text>
<text x="78.0" y="392.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="14" fill="#E0A95C" text-anchor="start" font-weight="bold">$</text>
<text x="96.0" y="392.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="14" fill="#FAFAF8" text-anchor="start" font-weight="normal"> bsk session stop</text>
<text x="78.0" y="416.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="14" fill="#7FC48B" text-anchor="start" font-weight="normal">[会话] a7f3 已关闭</text>
<text x="78.0" y="440.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="14" fill="#8A9099" text-anchor="start" font-weight="normal"></text>
<text x="78.0" y="464.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="14" fill="#8A9099" text-anchor="start" font-weight="normal"># 验收第五条：当前没有活跃会话</text>
<text x="78.0" y="488.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="14" fill="#E0A95C" text-anchor="start" font-weight="bold">$</text>
<text x="96.0" y="488.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="14" fill="#FAFAF8" text-anchor="start" font-weight="normal"> bsk session list</text>
<text x="78.0" y="512.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="14" fill="#7FC48B" text-anchor="start" font-weight="normal">（无输出，即无活跃会话）</text>
<rect x="56.0" y="564.0" width="888.0" height="62.0" rx="10" fill="#FBF3EC" stroke="#E8C9B4" stroke-width="1.5"/>
<text x="74.0" y="590.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#E0632D" text-anchor="start" font-weight="bold">补救动作</text>
<text x="160.0" y="590.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#1C2026" text-anchor="start" font-weight="normal">先在扩展管理页确认启用，再确认命令行工具和浏览器是同一台机器上的同一套。这一步必须人手动点。</text>
</svg>