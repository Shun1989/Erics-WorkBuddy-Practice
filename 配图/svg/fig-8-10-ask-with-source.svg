<text x="56.0" y="88.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#6B7280" text-anchor="start" font-weight="normal">先检索卡片和总目录，没出处的结论一律不算数</text>
<line x1="56" y1="106" x2="944" y2="106" stroke="#E5E1DA" stroke-width="1.5"/>
<text x="56.0" y="616.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#6B7280" text-anchor="start" font-weight="normal">出自场景 07 步骤 5。我问过库里根本没有的供应商交期，它回了我一个精确到天数的日期，还附了文件名。</text>
<rect x="56.0" y="217.0" width="888.0" height="252.0" rx="10" fill="#1C2026" stroke="#3A4049" stroke-width="1.5"/>
<path d="M66.0,251.04 L934.0,251.04" stroke="#3A4049" stroke-width="1"/>
