<text x="80.0" y="338.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#E0A95C" text-anchor="start" font-weight="bold">2. 正文包含：这份活是给谁干的、开工前必须拿到什么、步骤（不超过 7 条）、硬性规定、不许做的事、干完自查清单、向我汇</text>
<text x="80.0" y="357.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">报什么</text>
