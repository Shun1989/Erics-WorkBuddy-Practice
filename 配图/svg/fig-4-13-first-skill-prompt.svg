<text x="80.0" y="281.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">我：回顾我们这次做的「XXX」这件事，把它写成一个技能，存到 ~/.workbuddy/skills/YYY/SKILL.md。</text>
<text x="80.0" y="300.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">要求：</text>
