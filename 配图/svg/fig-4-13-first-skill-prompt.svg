<rect x="70.0" y="361.0" width="3.0" height="21.0" rx="0" fill="#E0A95C" stroke="#E0A95C" stroke-width="0"/>
<text x="80.0" y="376.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#E0A95C" text-anchor="start" font-weight="bold">3. 所有判定值、格式要求写具体，不许出现"注意""适当""尽量"</text>
