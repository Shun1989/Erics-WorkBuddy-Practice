<text x="56.0" y="58.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="27" fill="#1C2026" text-anchor="start" font-weight="bold">写法一：说完要它复述，复述对了才算写完</text>
<text x="56.0" y="88.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#6B7280" text-anchor="start" font-weight="normal">三条进记忆的规矩一次说完，最后一句是复述指令</text>
<line x1="56" y1="106" x2="944" y2="106" stroke="#E5E1DA" stroke-width="1.5"/>
<text x="56.0" y="616.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#6B7280" text-anchor="start" font-weight="normal">出自 5.3 写法一。最后那句复述指令不能省，我吃过亏：它把「报告表头照 2025 版」记成了 2022 版。</text>
<rect x="56.0" y="241.0" width="888.0" height="195.0" rx="10" fill="#1C2026" stroke="#3A4049" stroke-width="1.5"/>
<path d="M66.0,274.98 L934.0,274.98" stroke="#3A4049" stroke-width="1"/>
<circle cx="76.0" cy="257.98" r="5" fill="#E05C5C"/>
<circle cx="92.0" cy="257.98" r="5" fill="#E0A95C"/>
<circle cx="108.0" cy="257.98" r="5" fill="#5CB87C"/>
<text x="500.0" y="263.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#E5E1DA" text-anchor="middle" font-weight="bold">提示词  ·  可直接复制</text>
<text x="80.0" y="289.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">记住三件事，以后默认照做，不用我再重复。</text>
<text x="80.0" y="308.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal"></text>
<text x="80.0" y="327.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">1. 我的身份：汽车零部件研发工程师，做汽车微电机与智能执行器，11 年一线经验。</text>
<text x="80.0" y="346.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">2. 我写技术文件用中文，专业术语第一次出现时括号标注英文缩写，之后不再重复标注。</text>
<rect x="70.0" y="350.0" width="860.0" height="21.0" rx="4" fill="#3A2E1C" stroke="#3A2E1C" stroke-width="0"/>
<rect x="70.0" y="350.0" width="3.0" height="21.0" rx="0" fill="#E0A95C" stroke="#E0A95C" stroke-width="0"/>
<text x="80.0" y="365.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#E0A95C" text-anchor="start" font-weight="bold">3. 凡是涉及表格的任务，交付物一律是 .xlsx 文件，不要把结果用文字描述给我让我自己抄。</text>
<text x="80.0" y="384.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal"></text>
<rect x="70.0" y="388.0" width="860.0" height="21.0" rx="4" fill="#3A2E1C" stroke="#3A2E1C" stroke-width="0"/>
<rect x="70.0" y="388.0" width="3.0" height="21.0" rx="0" fill="#E0A95C" stroke="#E0A95C" stroke-width="0"/>
<text x="80.0" y="403.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#E0A95C" text-anchor="start" font-weight="bold">现在把上面三条复述一遍，逐条对应。哪一条你没把握，直接说。</text>
</svg>