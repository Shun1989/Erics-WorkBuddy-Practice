<text x="500.0" y="199.1" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#E5E1DA" text-anchor="middle" font-weight="bold">提示词  ·  可直接复制</text>
<text x="80.0" y="225.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">这是一份客户技术需求文档（SOR），文件在桌面 / SOR_某欧系平台_2026.pdf，共 68 页。</text>
<rect x="70.0" y="229.1" width="860.0" height="21.0" rx="4" fill="#3A2E1C" stroke="#3A2E1C" stroke-width="0"/>
<rect x="70.0" y="229.1" width="3.0" height="21.0" rx="0" fill="#E0A95C" stroke="#E0A95C" stroke-width="0"/>
<text x="80.0" y="244.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#E0A95C" text-anchor="start" font-weight="bold">先不要做任何修改，也不要生成任何文件，只回答我下面四个问题：</text>
<text x="80.0" y="263.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal"></text>
<text x="80.0" y="282.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">1. 这份文档一共有哪几个章节？列出章节号和标题。</text>
<text x="80.0" y="301.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">2. 全文一共出现多少次 must、多少次 shall、多少次 should？分别统计数字。</text>
<text x="80.0" y="320.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">3. 把所有含 must 或 shall 的条款挑出来，按章节号顺序列成一张表，包含：</text>
<text x="80.0" y="339.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">   条款号、条款英文原文（不要翻译、不要改写）、所属类别。</text>
<text x="80.0" y="358.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">   类别限这九种：性能、环境、寿命、电气、EMC、尺寸接口、文档交付、试验验证、其他。</text>
<text x="80.0" y="377.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">4. 挑出你认为存在歧义的条款（定义不清、缺少边界条件、前后不一致），</text>
<text x="80.0" y="396.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">   说明歧义具体在哪，以及它会影响哪些后续判断。</text>
<text x="80.0" y="415.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal"></text>
<text x="80.0" y="434.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">要求：</text>
<rect x="70.0" y="438.1" width="860.0" height="21.0" rx="4" fill="#3A2E1C" stroke="#3A2E1C" stroke-width="0"/>
<rect x="70.0" y="438.1" width="3.0" height="21.0" rx="0" fill="#E0A95C" stroke="#E0A95C" stroke-width="0"/>
<text x="80.0" y="453.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#E0A95C" text-anchor="start" font-weight="bold">- 第 3 问的表格不许省略任何条款，数量以你实际统计为准。</text>
<rect x="70.0" y="457.1" width="860.0" height="21.0" rx="4" fill="#3A2E1C" stroke="#3A2E1C" stroke-width="0"/>
<rect x="70.0" y="457.1" width="3.0" height="21.0" rx="0" fill="#E0A95C" stroke="#E0A95C" stroke-width="0"/>
<text x="80.0" y="472.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#E0A95C" text-anchor="start" font-weight="bold">- 如果你对某条条款的类别没把握，类别栏填"待定"，不要猜。</text>
<text x="80.0" y="491.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">- 回答完先别给建议，我会接着问。</text>
</svg>