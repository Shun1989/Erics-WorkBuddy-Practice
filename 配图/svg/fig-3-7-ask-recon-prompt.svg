<rect x="56.0" y="177.1" width="888.0" height="347.0" rx="10" fill="#1C2026" stroke="#3A4049" stroke-width="1.5"/>
<path d="M66.0,211.14 L934.0,211.14" stroke="#3A4049" stroke-width="1"/>
