<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650">
<rect width="1000" height="650" fill="#FAFAF8"/>
<marker id="ar-6B7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker>
<marker id="ar-E0632D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0632D"/></marker>
<marker id="ar-2D6A6A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D6A6A"/></marker>
<marker id="ar-1C2026" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1C2026"/></marker>
<text x="56.0" y="58.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="27" fill="#1C2026" text-anchor="start" font-weight="bold">干错方向的三个入口</text>
<text x="56.0" y="88.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#6B7280" text-anchor="start" font-weight="normal">这一类最隐蔽，因为它的每一步看起来都做对了</text>
<line x1="56" y1="106" x2="944" y2="106" stroke="#E5E1DA" stroke-width="1.5"/>
<text x="56.0" y="616.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#6B7280" text-anchor="start" font-weight="normal">问它一句按你理解做完了是什么样：答得出来只是理解不同，答不出来得从头来</text>
<rect x="56.0" y="200.0" width="277.3" height="170.0" rx="10" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="1.5"/>
<rect x="56.0" y="200.0" width="6.0" height="170.0" rx="3" fill="#2D6A6A" stroke="#2D6A6A" stroke-width="0"/>
<text x="76.0" y="230.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" fill="#1C2026" text-anchor="start" font-weight="bold">入口一 第一句没写清</text>
<text x="76.0" y="256.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#6B7280" text-anchor="start" font-weight="normal">回到你发给它的第一句话，看有没有</text>
<text x="76.0" y="277.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#6B7280" text-anchor="start" font-weight="normal">一句做成什么样算完成；停下来重写</text>
<text x="76.0" y="298.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#6B7280" text-anchor="start" font-weight="normal">完成条件再开工</text>
<line x1="337.3" y1="285.0" x2="357.3" y2="285.0" stroke="#2D6A6A" stroke-width="2" marker-end="url(#ar-2D6A6A)"/>
<rect x="361.3" y="200.0" width="277.3" height="170.0" rx="10" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="1.5"/>
<rect x="361.3" y="200.0" width="6.0" height="170.0" rx="3" fill="#2D6A6A" stroke="#2D6A6A" stroke-width="0"/>
<text x="381.3" y="230.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" fill="#1C2026" text-anchor="start" font-weight="bold">入口二 中途漂移</text>
<text x="381.3" y="256.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#6B7280" text-anchor="start" font-weight="normal">前三轮都对，第四轮开始跑偏；让它</text>
<text x="381.3" y="277.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#6B7280" text-anchor="start" font-weight="normal">复述最初定的三条约定；换新对话用</text>
<text x="381.3" y="298.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#6B7280" text-anchor="start" font-weight="normal">状态文件接上</text>
<line x1="642.7" y1="285.0" x2="662.7" y2="285.0" stroke="#2D6A6A" stroke-width="2" marker-end="url(#ar-2D6A6A)"/>
<rect x="666.7" y="200.0" width="277.3" height="170.0" rx="10" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="1.5"/>
<rect x="666.7" y="200.0" width="6.0" height="170.0" rx="3" fill="#2D6A6A" stroke="#2D6A6A" stroke-width="0"/>
<text x="686.7" y="230.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" fill="#1C2026" text-anchor="start" font-weight="bold">入口三 没有停止条件</text>
<text x="686.7" y="256.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#6B7280" text-anchor="start" font-weight="normal">它一直在干就是不停；问它按你理解</text>
<text x="686.7" y="277.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#6B7280" text-anchor="start" font-weight="normal">做到哪一步算完成，你确认后它才继</text>
<text x="686.7" y="298.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#6B7280" text-anchor="start" font-weight="normal">续</text>
</svg>