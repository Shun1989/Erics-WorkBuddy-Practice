<text x="56.0" y="616.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#6B7280" text-anchor="start" font-weight="normal">没有提交号的汇报你只能选择信或不信，那不叫验收，叫赌。</text>
