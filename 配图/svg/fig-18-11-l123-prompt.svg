<text x="56.0" y="58.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="27" fill="#1C2026" text-anchor="start" font-weight="bold">三级派活模板：第一行写死级别</text>
<text x="56.0" y="88.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#6B7280" text-anchor="start" font-weight="normal">场景 71：L1 全自动，L2 干九成，L3 只给信息</text>
<line x1="56" y1="106" x2="944" y2="106" stroke="#E5E1DA" stroke-width="1.5"/>
<text x="56.0" y="616.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#6B7280" text-anchor="start" font-weight="normal">它不许自己给自己升级，定级是你做的事</text>
<rect x="56.0" y="201.1" width="888.0" height="290.0" rx="10" fill="#1C2026" stroke="#3A4049" stroke-width="1.5"/>
<path d="M66.0,235.07999999999998 L934.0,235.07999999999998" stroke="#3A4049" stroke-width="1"/>
<circle cx="76.0" cy="218.07999999999998" r="5" fill="#E05C5C"/>
<circle cx="92.0" cy="218.07999999999998" r="5" fill="#E0A95C"/>
<circle cx="108.0" cy="218.07999999999998" r="5" fill="#5CB87C"/>
<text x="500.0" y="223.1" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#E5E1DA" text-anchor="middle" font-weight="bold">提示词  ·  可直接复制</text>
<rect x="70.0" y="234.1" width="860.0" height="21.0" rx="4" fill="#3A2E1C" stroke="#3A2E1C" stroke-width="0"/>
<rect x="70.0" y="234.1" width="3.0" height="21.0" rx="0" fill="#E0A95C" stroke="#E0A95C" stroke-width="0"/>
<text x="80.0" y="249.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#E0A95C" text-anchor="start" font-weight="bold">【级别】L1 常规任务。你可以全自动跑完，出错自己修，修完告诉我修了什么。</text>
<text x="80.0" y="268.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">【验收】完成后跑一次自检：总条数、空行数、占位符数、异常值条数。</text>
<text x="80.0" y="287.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">有任何一项不为零，你自己修完再汇报，不许带着问题交给我。</text>
<text x="80.0" y="306.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal"></text>
<rect x="70.0" y="310.1" width="860.0" height="21.0" rx="4" fill="#3A2E1C" stroke="#3A2E1C" stroke-width="0"/>
<rect x="70.0" y="310.1" width="3.0" height="21.0" rx="0" fill="#E0A95C" stroke="#E0A95C" stroke-width="0"/>
<text x="80.0" y="325.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#E0A95C" text-anchor="start" font-weight="bold">【级别】L2 复杂任务。你做九成，最后一步停下来等我。</text>
<text x="80.0" y="344.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">【第一阶段：只出方案，不许动手】</text>
<text x="80.0" y="363.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">给我三条路，每条写四件事：走这条路要做什么、要多久、放弃什么、最可能在哪里翻车。</text>
<text x="80.0" y="382.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">写完停住，等我选。我不点头，不许进入第二阶段。</text>
<text x="80.0" y="401.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal"></text>
<rect x="70.0" y="405.1" width="860.0" height="21.0" rx="4" fill="#3A2E1C" stroke="#3A2E1C" stroke-width="0"/>
<rect x="70.0" y="405.1" width="3.0" height="21.0" rx="0" fill="#E0A95C" stroke="#E0A95C" stroke-width="0"/>
<text x="80.0" y="420.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#E0A95C" text-anchor="start" font-weight="bold">【级别】L3 高风险任务。你只给信息和选项，不许执行，不许替我做决定。</text>
<text x="80.0" y="439.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">【纪律】不许给出“我建议选第 N 条”这类结论。</text>
<text x="80.0" y="458.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">不许执行任何动作，包括创建文件、发送消息、修改配置。</text>
</svg>