<text x="56.0" y="58.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="27" fill="#1C2026" text-anchor="start" font-weight="bold">图 10-15 建模过程跑了三遍，前两遍各卡在一个接口上</text>
<text x="56.0" y="88.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#6B7280" text-anchor="start" font-weight="normal">场景 20 过程与判断点：两次失败的录像和日志都留着没删</text>
<line x1="56" y1="106" x2="944" y2="106" stroke="#E5E1DA" stroke-width="1.5"/>
<text x="56.0" y="616.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#6B7280" text-anchor="start" font-weight="normal">中间还有一轮空转：让它先把方案想清楚，推理 token 烧到 3.2 万的上限，什么都没输出，一个工具也没调，白等将近七十分钟。</text>
<rect x="56.0" y="140.0" width="888.0" height="133.3" rx="12" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="1.5"/>
<rect x="56.0" y="140.0" width="888.0" height="42.0" rx="12" fill="#F2EDE6" stroke="#F2EDE6" stroke-width="0"/>
<text x="76.0" y="168.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" fill="#1C2026" text-anchor="start" font-weight="bold">第一遍：做到后毂中止</text>
<text x="76.0" y="206.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#6B7280" text-anchor="start" font-weight="normal">把 FeatureByName 这个接口用错了对象，报错指向特征名。冒烟测试阶段就该把每条接口单独试一遍。</text>
<rect x="56.0" y="293.3" width="888.0" height="133.3" rx="12" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="1.5"/>
<rect x="56.0" y="293.3" width="888.0" height="42.0" rx="12" fill="#F2EDE6" stroke="#F2EDE6" stroke-width="0"/>
<text x="76.0" y="321.3" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" fill="#1C2026" text-anchor="start" font-weight="bold">第二遍：气囊盖圆角卡住</text>
<text x="76.0" y="359.3" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#6B7280" text-anchor="start" font-weight="normal">圆角返回的是一个动态派发对象，跟它预期的类型对不上。清空记录从头重建。</text>
<rect x="56.0" y="446.7" width="888.0" height="133.3" rx="12" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="1.5"/>
<rect x="56.0" y="446.7" width="888.0" height="42.0" rx="12" fill="#F2EDE6" stroke="#F2EDE6" stroke-width="0"/>
<text x="76.0" y="474.7" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" fill="#1C2026" text-anchor="start" font-weight="bold">第三遍：跑完</text>
<text x="76.0" y="512.7" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#6B7280" text-anchor="start" font-weight="normal">二十三种零件、四十四处实例，每个特征都命名、记录、重建。每个零件保存前确认三件事：单实体、体积为正、包围盒与解析值一致。</text>
</svg>