<text x="76.0" y="206.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#6B7280" text-anchor="start" font-weight="normal">不等设计冻结就开模，模具与设计同步推进。代价是模具返修风险上升。</text>
