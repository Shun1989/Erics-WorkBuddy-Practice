<text x="76.0" y="359.3" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#6B7280" text-anchor="start" font-weight="normal">把设计验证拆成两轮，先验风险高的部分。代价是试验费用增加约 30%。</text>
