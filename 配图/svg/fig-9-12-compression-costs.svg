<text x="76.0" y="512.7" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#6B7280" text-anchor="start" font-weight="normal">不等图纸冻结先下长交期件的单。代价是产生呆滞库存风险。</text>
