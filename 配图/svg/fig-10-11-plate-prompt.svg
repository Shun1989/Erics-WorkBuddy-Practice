<text x="56.0" y="58.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="27" fill="#1C2026" text-anchor="start" font-weight="bold">图 10-11 一块安装板的提示词原文：单位规矩和命名规矩写死在最前面</text>
<text x="56.0" y="88.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#6B7280" text-anchor="start" font-weight="normal">场景 19 可复制提示词节选，两个带底色的行是翻车最多的两处</text>
<line x1="56" y1="106" x2="944" y2="106" stroke="#E5E1DA" stroke-width="1.5"/>
<text x="56.0" y="616.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#6B7280" text-anchor="start" font-weight="normal">单位规矩写在最前面，是因为模型大一千倍这个症状出现过不止一次。命名规矩写清楚，三个月后改那个孔的位置时你不用在一棵默认名的树里翻半天。</text>
<rect x="56.0" y="209.1" width="888.0" height="271.0" rx="10" fill="#1C2026" stroke="#3A4049" stroke-width="1.5"/>
<path d="M66.0,243.06 L934.0,243.06" stroke="#3A4049" stroke-width="1"/>
<circle cx="76.0" cy="226.06" r="5" fill="#E05C5C"/>
<circle cx="92.0" cy="226.06" r="5" fill="#E0A95C"/>
<circle cx="108.0" cy="226.06" r="5" fill="#5CB87C"/>
<text x="500.0" y="231.1" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#E5E1DA" text-anchor="middle" font-weight="bold">提示词  ·  可直接复制</text>
<text x="80.0" y="257.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">【零件】一块 120 × 80 × 12 毫米的矩形安装板，四个直角各倒 R10 圆角，</text>
<text x="80.0" y="276.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">四个 Ø9 安装通孔，中心一个 Ø40 过孔。</text>
<text x="80.0" y="295.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal"></text>
<rect x="70.0" y="299.1" width="860.0" height="21.0" rx="4" fill="#3A2E1C" stroke="#3A2E1C" stroke-width="0"/>
<rect x="70.0" y="299.1" width="3.0" height="21.0" rx="0" fill="#E0A95C" stroke="#E0A95C" stroke-width="0"/>
<text x="80.0" y="314.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#E0A95C" text-anchor="start" font-weight="bold">【单位规矩】我说的全部是毫米。SOLIDWORKS 接口入参的内部单位与毫米不同，</text>
<text x="80.0" y="333.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">你负责换算；回读给我看的每一个结果一律换算回毫米，并在数字后面标注单位。</text>
<text x="80.0" y="352.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal"></text>
<rect x="70.0" y="356.1" width="860.0" height="21.0" rx="4" fill="#3A2E1C" stroke="#3A2E1C" stroke-width="0"/>
<rect x="70.0" y="356.1" width="3.0" height="21.0" rx="0" fill="#E0A95C" stroke="#E0A95C" stroke-width="0"/>
<text x="80.0" y="371.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#E0A95C" text-anchor="start" font-weight="bold">【命名】特征必须按规矩命名：草图1_底板、拉伸1_底板、切除1_安装孔、</text>
<text x="80.0" y="390.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">切除2_中心孔、圆角1_倒角。</text>
<text x="80.0" y="409.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal"></text>
<text x="80.0" y="428.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">【纪律】任何一步失败，先把 SOLIDWORKS 返回的原始报错原样贴给我，</text>
<rect x="70.0" y="432.1" width="860.0" height="21.0" rx="4" fill="#3A2E1C" stroke="#3A2E1C" stroke-width="0"/>
<rect x="70.0" y="432.1" width="3.0" height="21.0" rx="0" fill="#E0A95C" stroke="#E0A95C" stroke-width="0"/>
<text x="80.0" y="447.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#E0A95C" text-anchor="start" font-weight="bold">然后停下来等我指示。不许自己猜原因，不许带着报错继续往下做。</text>
</svg>