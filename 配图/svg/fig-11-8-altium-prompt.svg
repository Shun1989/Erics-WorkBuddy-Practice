<marker id="ar-1C2026" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1C2026"/></marker>
<text x="56.0" y="58.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="27" fill="#1C2026" text-anchor="start" font-weight="bold">图 11-8 Altium 一侧最小起步任务的提示词，纪律里三条防破坏</text>
<text x="56.0" y="88.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#6B7280" text-anchor="start" font-weight="normal">场景 25 可复制提示词，走脚本文件桥的路线</text>
<line x1="56" y1="106" x2="944" y2="106" stroke="#E5E1DA" stroke-width="1.5"/>
<text x="56.0" y="616.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#6B7280" text-anchor="start" font-weight="normal">起点故意做得很小：我要的是 50 乘 50 毫米的板框加三个器件，不是整块控制板。每加一级加一条校核：器件数、网络数、DRC 违规数。</text>
<rect x="56.0" y="193.1" width="888.0" height="309.0" rx="10" fill="#1C2026" stroke="#3A4049" stroke-width="1.5"/>
<path d="M66.0,227.1 L934.0,227.1" stroke="#3A4049" stroke-width="1"/>
<circle cx="76.0" cy="210.1" r="5" fill="#E05C5C"/>
<circle cx="92.0" cy="210.1" r="5" fill="#E0A95C"/>
<circle cx="108.0" cy="210.1" r="5" fill="#5CB87C"/>
<text x="500.0" y="215.1" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#E5E1DA" text-anchor="middle" font-weight="bold">提示词  ·  可直接复制</text>
<text x="80.0" y="241.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">你现在可以通过 eda 这台 MCP 服务器，驱动我电脑上已经打开的 Altium Designer。</text>
<text x="80.0" y="260.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">它走的是脚本文件桥：你写脚本文件，软件执行，你再读回输出文件。</text>
<text x="80.0" y="279.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal"></text>
<text x="80.0" y="298.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">【任务】在一个新建的 PCB 工程里做一件最小的事，先别做大：</text>
<text x="80.0" y="317.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">1. 建一个 50 × 50 毫米的板框，原点在左下角。</text>
<text x="80.0" y="336.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">2. 放置三个器件：R1（0805 封装）、C1（0805 封装）、U1（SOT-23 封装）。</text>
<text x="80.0" y="355.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">   坐标分别是 (10, 10)、(20, 10)、(30, 25)，单位毫米。</text>
<text x="80.0" y="374.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">3. 把 R1 的第 2 脚与 C1 的第 1 脚连成网络 NET_MID。</text>
<text x="80.0" y="393.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal"></text>
<text x="80.0" y="412.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">【纪律】</text>
<rect x="70.0" y="416.1" width="860.0" height="21.0" rx="4" fill="#3A2E1C" stroke="#3A2E1C" stroke-width="0"/>
<rect x="70.0" y="416.1" width="3.0" height="21.0" rx="0" fill="#E0A95C" stroke="#E0A95C" stroke-width="0"/>
<text x="80.0" y="431.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#E0A95C" text-anchor="start" font-weight="bold">1. 任何一步失败，把软件返回的原始报错原样贴给我，然后停下来等我指示。</text>
<rect x="70.0" y="435.1" width="860.0" height="21.0" rx="4" fill="#3A2E1C" stroke="#3A2E1C" stroke-width="0"/>
<rect x="70.0" y="435.1" width="3.0" height="21.0" rx="0" fill="#E0A95C" stroke="#E0A95C" stroke-width="0"/>
<text x="80.0" y="450.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#E0A95C" text-anchor="start" font-weight="bold">2. 封装名如果对不上库里的实际名字，停下报告，不许就近选一个相似的。</text>
<rect x="70.0" y="454.1" width="860.0" height="21.0" rx="4" fill="#3A2E1C" stroke="#3A2E1C" stroke-width="0"/>
<rect x="70.0" y="454.1" width="3.0" height="21.0" rx="0" fill="#E0A95C" stroke="#E0A95C" stroke-width="0"/>
<text x="80.0" y="469.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#E0A95C" text-anchor="start" font-weight="bold">3. 全程只操作 D:\AI-EDA\demo01 这个副本目录，不许碰任何原始工程文件。</text>
</svg>