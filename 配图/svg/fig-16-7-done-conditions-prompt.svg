<text x="80.0" y="469.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#E0A95C" text-anchor="start" font-weight="bold">先不要修改文件。请先复述 C1 到 C6，列出你无法验证的条目和需要我决定的问题。</text>
