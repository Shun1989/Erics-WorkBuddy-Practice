<text x="80.0" y="241.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">【完成条件】</text>
<text x="80.0" y="260.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">C1. 必须交付：[文件 1、文件 2、文件 3]，保存到：[完整路径]</text>
<text x="80.0" y="279.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">C2. 每个输入项都要在输出中找到对应结果，输入数与处理数必须一致</text>
<text x="80.0" y="298.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">C3. 输出必须包含：[必备章节、字段、函数或表格]</text>
<rect x="70.0" y="302.1" width="860.0" height="21.0" rx="4" fill="#3A2E1C" stroke="#3A2E1C" stroke-width="0"/>
<rect x="70.0" y="302.1" width="3.0" height="21.0" rx="0" fill="#E0A95C" stroke="#E0A95C" stroke-width="0"/>
<text x="80.0" y="317.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#E0A95C" text-anchor="start" font-weight="bold">C4. 缺少依据的内容统一写“待确认”，不得补写成确定事实</text>
<text x="80.0" y="336.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">C5. 执行验收：[命令、抽查方法或核对动作]，结果达到：[明确门槛]</text>
<text x="80.0" y="355.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">C6. 生成 deliverable_report.md，按 C1 到 C5 逐条写：通过或未通过、证据路径、剩余问题</text>
<text x="80.0" y="374.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal"></text>
<text x="80.0" y="393.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">【失败条件】</text>
<rect x="70.0" y="397.1" width="860.0" height="21.0" rx="4" fill="#3A2E1C" stroke="#3A2E1C" stroke-width="0"/>
<rect x="70.0" y="397.1" width="3.0" height="21.0" rx="0" fill="#E0A95C" stroke="#E0A95C" stroke-width="0"/>
<text x="80.0" y="412.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#E0A95C" text-anchor="start" font-weight="bold">只要任一完成条件未通过，整体状态就写“未完成”。不得用完成百分比替代失败项。</text>
<text x="80.0" y="431.1" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal"></text>
