<text x="56.0" y="58.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="27" fill="#1C2026" text-anchor="start" font-weight="bold">图 10-16 在 WorkBuddy 里登记 MCP 服务器的配置形态与握手验收</text>
<text x="56.0" y="88.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#6B7280" text-anchor="start" font-weight="normal">场景 20 WorkBuddy 侧配置三步，第三步是验握手</text>
<line x1="56" y1="106" x2="944" y2="106" stroke="#E5E1DA" stroke-width="1.5"/>
<text x="56.0" y="596.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#6B7280" text-anchor="start" font-weight="normal">握手验收：新建一个 Agent 模式的对话，让它跑一句列出这台服务器上所有可用工具。工具列表里出现建草图、拉伸、切除、倒圆角、保存、导出 STEP </text>
<text x="56.0" y="616.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#6B7280" text-anchor="start" font-weight="normal">这几项，就成了。看不到工具列表先别提建模需求，回头查桥有没有起来、软件有没有先开。</text>
<rect x="56.0" y="128.0" width="888.0" height="408.0" rx="10" fill="#1C2026" stroke="#3A4049" stroke-width="1.5"/>
<path d="M66,162 L934,162" stroke="#3A4049" stroke-width="1"/>
<circle cx="76" cy="145" r="5" fill="#E05C5C"/>
<circle cx="92" cy="145" r="5" fill="#E0A95C"/>
<circle cx="108" cy="145" r="5" fill="#5CB87C"/>
<text x="500.0" y="150.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#E5E1DA" text-anchor="middle" font-weight="bold">终端  ·  bash</text>
<text x="78.0" y="176.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="14" fill="#E5E1DA" text-anchor="start" font-weight="normal">装上那座桥，在本机把 SolidWorks-MCP 跑起来</text>
<text x="78.0" y="200.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="14" fill="#8A9099" text-anchor="start" font-weight="normal">{</text>
<text x="78.0" y="224.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="14" fill="#8A9099" text-anchor="start" font-weight="normal">  "mcpServers": {</text>
<text x="78.0" y="248.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="14" fill="#8A9099" text-anchor="start" font-weight="normal">    "solidworks": {</text>
<text x="78.0" y="272.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="14" fill="#8A9099" text-anchor="start" font-weight="normal">      "command": "python",</text>
<text x="78.0" y="296.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="14" fill="#8A9099" text-anchor="start" font-weight="normal">      "args": ["-m", "solidworks_mcp", "--host", "127.0.0.1", "--port", "8765"],</text>
<text x="78.0" y="320.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="14" fill="#8A9099" text-anchor="start" font-weight="normal">      "disabled": false</text>
<text x="78.0" y="344.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="14" fill="#8A9099" text-anchor="start" font-weight="normal">    }</text>
<text x="78.0" y="368.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="14" fill="#8A9099" text-anchor="start" font-weight="normal">  }</text>
<text x="78.0" y="392.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="14" fill="#8A9099" text-anchor="start" font-weight="normal">}</text>
