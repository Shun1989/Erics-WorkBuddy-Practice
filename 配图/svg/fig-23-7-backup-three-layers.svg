<text x="56.0" y="58.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="27" fill="#1C2026" text-anchor="start" font-weight="bold">三层目录与三份备份</text>
<text x="56.0" y="88.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#6B7280" text-anchor="start" font-weight="normal">原件只读、工作可写、输出可丢；出事那天再做，已经晚了</text>
<line x1="56" y1="106" x2="944" y2="106" stroke="#E5E1DA" stroke-width="1.5"/>
<text x="56.0" y="616.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#6B7280" text-anchor="start" font-weight="normal">三份备份：动手前的本地快照、版本管理的一次提交、每周五复制到异地的那一份</text>
<rect x="90.0" y="140.0" width="820.0" height="78.0" rx="10" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="1.5"/>
