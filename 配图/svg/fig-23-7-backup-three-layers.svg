<text x="120.0" y="170.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" fill="#1C2026" text-anchor="start" font-weight="bold">原件层 archive：只读</text>
<text x="120.0" y="192.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#6B7280" text-anchor="start" font-weight="normal">客户原件、设备原始导出、不能重做的东西；设完要验一次，让它试着写应当报错</text>
<rect x="90.0" y="230.0" width="820.0" height="78.0" rx="10" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="1.5"/>
<rect x="90.0" y="230.0" width="8.0" height="78.0" rx="4" fill="#6B7280" stroke="#6B7280" stroke-width="0"/>
<text x="120.0" y="260.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" fill="#1C2026" text-anchor="start" font-weight="bold">工作层 work：可读写</text>
<text x="120.0" y="282.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#6B7280" text-anchor="start" font-weight="normal">它唯一能改的地方，每次动手前备份；给它文件白名单，让它先报改动对照表</text>
<rect x="90.0" y="320.0" width="820.0" height="78.0" rx="10" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="1.5"/>
<rect x="90.0" y="320.0" width="8.0" height="78.0" rx="4" fill="#6B7280" stroke="#6B7280" stroke-width="0"/>
<text x="120.0" y="350.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" fill="#1C2026" text-anchor="start" font-weight="bold">输出层 out：可读写，可清空</text>
<text x="120.0" y="372.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#6B7280" text-anchor="start" font-weight="normal">它产出的新文件，丢了重跑就行，原件一个字节都不动</text>
