<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" style="background:#FAFAF8"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#6B7280"/></marker></defs><rect width="1000" height="650" fill="#FAFAF8"/><text x="500" y="46" font-family="Microsoft YaHei" font-size="26" fill="#1C2026" font-weight="800" text-anchor="middle">同样的能力，不同的门槛</text>
<text x="500" y="74" font-family="Microsoft YaHei" font-size="15" fill="#6B7280" font-weight="normal" text-anchor="middle">命令行 Agent：每一步都要你跨过去；WorkBuddy：门是开着的</text>
<rect x="60" y="100" width="380" height="60" fill="#fff" stroke="#6B7280" stroke-width="2.5" rx="12"/>
<text x="250" y="138" font-family="Microsoft YaHei" font-size="21" fill="#1C2026" font-weight="800" text-anchor="middle">命令行 Agent</text>
<rect x="60" y="180" width="380" height="66" fill="#fff" stroke="#E5E1DA" stroke-width="1.5" rx="10"/>
<text x="82" y="208" font-family="Microsoft YaHei" font-size="16" fill="#1C2026" font-weight="700" text-anchor="start">1. 装运行环境</text>
<text x="82" y="232" font-family="Microsoft YaHei" font-size="13.5" fill="#6B7280" font-weight="normal" text-anchor="start">英文报错自己查</text>
<rect x="60" y="258" width="380" height="66" fill="#fff" stroke="#E5E1DA" stroke-width="1.5" rx="10"/>
<text x="82" y="286" font-family="Microsoft YaHei" font-size="16" fill="#1C2026" font-weight="700" text-anchor="start">2. 学指令格式</text>
<text x="82" y="310" font-family="Microsoft YaHei" font-size="13.5" fill="#6B7280" font-weight="normal" text-anchor="start">路径、参数、语法</text>
<rect x="60" y="336" width="380" height="66" fill="#fff" stroke="#E5E1DA" stroke-width="1.5" rx="10"/>
<text x="82" y="364" font-family="Microsoft YaHei" font-size="16" fill="#1C2026" font-weight="700" text-anchor="start">3. 记命令</text>
<text x="82" y="388" font-family="Microsoft YaHei" font-size="13.5" fill="#6B7280" font-weight="normal" text-anchor="start">忘了就翻文档</text>
<rect x="60" y="414" width="380" height="66" fill="#fff" stroke="#E5E1DA" stroke-width="1.5" rx="10"/>
<text x="82" y="442" font-family="Microsoft YaHei" font-size="16" fill="#1C2026" font-weight="700" text-anchor="start">4. 看日志排错</text>
<text x="82" y="466" font-family="Microsoft YaHei" font-size="13.5" fill="#6B7280" font-weight="normal" text-anchor="start">报错以英文为主</text>
<rect x="60" y="492" width="380" height="66" fill="#fff" stroke="#E5E1DA" stroke-width="1.5" rx="10"/>
<text x="82" y="520" font-family="Microsoft YaHei" font-size="16" fill="#1C2026" font-weight="700" text-anchor="start">5. 干完自己翻文件</text>
<text x="82" y="544" font-family="Microsoft YaHei" font-size="13.5" fill="#6B7280" font-weight="normal" text-anchor="start">静悄悄，无交差汇报</text>
<rect x="560" y="100" width="380" height="60" fill="#E0632D" stroke="#E0632D" stroke-width="2.5" rx="12"/>
<text x="750" y="138" font-family="Microsoft YaHei" font-size="21" fill="#fff" font-weight="800" text-anchor="middle">WorkBuddy</text>
<rect x="560" y="180" width="380" height="66" fill="#fff" stroke="#E5E1DA" stroke-width="1.5" rx="10"/>
<text x="582" y="208" font-family="Microsoft YaHei" font-size="16" fill="#1C2026" font-weight="700" text-anchor="start">1. 安装包下一步</text>
<text x="582" y="232" font-family="Microsoft YaHei" font-size="13.5" fill="#6B7280" font-weight="normal" text-anchor="start">装完即用</text>
<rect x="560" y="258" width="380" height="66" fill="#fff" stroke="#E5E1DA" stroke-width="1.5" rx="10"/>
<text x="582" y="286" font-family="Microsoft YaHei" font-size="16" fill="#1C2026" font-weight="700" text-anchor="start">2. 说中文交活</text>
<text x="582" y="310" font-family="Microsoft YaHei" font-size="13.5" fill="#6B7280" font-weight="normal" text-anchor="start">像给同事交代工作</text>
<rect x="560" y="336" width="380" height="66" fill="#fff" stroke="#E5E1DA" stroke-width="1.5" rx="10"/>
<text x="582" y="364" font-family="Microsoft YaHei" font-size="16" fill="#1C2026" font-weight="700" text-anchor="start">3. 拖文件进去</text>
<text x="582" y="388" font-family="Microsoft YaHei" font-size="13.5" fill="#6B7280" font-weight="normal" text-anchor="start">不用记任何路径</text>
<rect x="560" y="414" width="380" height="66" fill="#fff" stroke="#E5E1DA" stroke-width="1.5" rx="10"/>
<text x="582" y="442" font-family="Microsoft YaHei" font-size="16" fill="#1C2026" font-weight="700" text-anchor="start">4. 它先自查</text>
<text x="582" y="466" font-family="Microsoft YaHei" font-size="13.5" fill="#6B7280" font-weight="normal" text-anchor="start">解决不了用中文告诉你</text>
<rect x="560" y="492" width="380" height="66" fill="#fff" stroke="#E5E1DA" stroke-width="1.5" rx="10"/>
<text x="582" y="520" font-family="Microsoft YaHei" font-size="16" fill="#1C2026" font-weight="700" text-anchor="start">5. 干完主动交差</text>
<text x="582" y="544" font-family="Microsoft YaHei" font-size="13.5" fill="#6B7280" font-weight="normal" text-anchor="start">改了什么、哪里拿不准</text>
<line x1="455" y1="320" x2="545" y2="320" stroke="#E0632D" stroke-width="3" marker-end="url(#arr)"/>
<text x="500" y="300" font-family="Microsoft YaHei" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="middle">同级别的干活能力</text>
<rect x="150" y="584" width="700" height="44" fill="#F2EDE6" stroke="#E5E1DA" stroke-width="1.5" rx="10"/>
<text x="500" y="612" font-family="Microsoft YaHei" font-size="15" fill="#1C2026" font-weight="700" text-anchor="middle">能力相近时，门槛决定你用不用得起：工程现场的人，选门开着的那个</text></svg>