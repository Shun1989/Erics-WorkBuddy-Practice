<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650">
<rect width="1000" height="650" fill="#FAFAF8"/>
<marker id="ar-6B7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker>
<marker id="ar-E0632D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0632D"/></marker>
<marker id="ar-2D6A6A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D6A6A"/></marker>
<marker id="ar-1C2026" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1C2026"/></marker>
<text x="56.0" y="58.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="27" fill="#1C2026" text-anchor="start" font-weight="bold">整理规矩就是这一步：不点头不许改任何文件</text>
<text x="56.0" y="88.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#6B7280" text-anchor="start" font-weight="normal">场景 49 可复制提示词的第二步，五条规矩逐条写死</text>
<line x1="56" y1="106" x2="944" y2="106" stroke="#E5E1DA" stroke-width="1.5"/>
<text x="56.0" y="616.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#6B7280" text-anchor="start" font-weight="normal">填 0 会让频谱多出假的低频能量；填上一行的值会让频谱变干净，看着特别漂亮。两种都是造假</text>
<rect x="56.0" y="233.0" width="888.0" height="214.0" rx="10" fill="#1C2026" stroke="#3A4049" stroke-width="1.5"/>
<path d="M66.0,267.0 L934.0,267.0" stroke="#3A4049" stroke-width="1"/>
<circle cx="76.0" cy="250.0" r="5" fill="#E05C5C"/>
<circle cx="92.0" cy="250.0" r="5" fill="#E0A95C"/>
<circle cx="108.0" cy="250.0" r="5" fill="#5CB87C"/>
<text x="500.0" y="255.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#E5E1DA" text-anchor="middle" font-weight="bold">提示词  ·  可直接复制</text>
<text x="80.0" y="281.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">【第二步：统一规矩，我确认之后你才许执行】</text>
<text x="80.0" y="300.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">1. 文件命名：{产品族}_{样本号}_{工况}_{测点}_{日期}.csv</text>
<text x="80.0" y="319.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">   示例：M12_S017_12V_load_A_20260314.csv</text>
<text x="80.0" y="338.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">2. 列命名：time, ch1_mic, ch2_acc_x, ch3_acc_y, ch4_acc_z, rpm</text>
<text x="80.0" y="357.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">   全部小写，不许有空格，不许有中文列名。</text>
<text x="80.0" y="376.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">3. time 列统一为相对时间，单位秒，保留三位小数，第一个采样点为 0.000。</text>
<text x="80.0" y="395.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">4. 采样率统一写进一个 metadata.json，不许写在数据文件里。</text>
<rect x="70.0" y="399.0" width="860.0" height="21.0" rx="4" fill="#3A2E1C" stroke="#3A2E1C" stroke-width="0"/>
<rect x="70.0" y="399.0" width="3.0" height="21.0" rx="0" fill="#E0A95C" stroke="#E0A95C" stroke-width="0"/>
<text x="80.0" y="414.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#E0A95C" text-anchor="start" font-weight="bold">5. 缺失值一律保留为空。不许填 0，不许填上一行的值，不许插值，不许删除行。</text>
</svg>