<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650">
<rect width="1000" height="650" fill="#FAFAF8"/>
<marker id="ar-6B7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker>
<marker id="ar-E0632D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0632D"/></marker>
<marker id="ar-2D6A6A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D6A6A"/></marker>
<marker id="ar-1C2026" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1C2026"/></marker>
<text x="56.0" y="58.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="27" fill="#1C2026" text-anchor="start" font-weight="bold">场景 C2 的幂等规矩：同一段标题只允许存在一次</text>
<text x="56.0" y="88.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#6B7280" text-anchor="start" font-weight="normal">可复制提示词的【幂等规矩】与【格式规矩】两段，逐字取自正文</text>
<line x1="56" y1="106" x2="944" y2="106" stroke="#E5E1DA" stroke-width="1.5"/>
<text x="56.0" y="616.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#6B7280" text-anchor="start" font-weight="normal">故意让它跑两遍，看文档里有没有出现两套本周结论。出现两套，说明幂等规矩没吃进去。</text>
<rect x="56.0" y="217.0" width="888.0" height="252.0" rx="10" fill="#1C2026" stroke="#3A4049" stroke-width="1.5"/>
<path d="M66.0,251.04 L934.0,251.04" stroke="#3A4049" stroke-width="1"/>
<circle cx="76.0" cy="234.04" r="5" fill="#E05C5C"/>
<circle cx="92.0" cy="234.04" r="5" fill="#E0A95C"/>
<circle cx="108.0" cy="234.04" r="5" fill="#5CB87C"/>
<text x="500.0" y="239.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#E5E1DA" text-anchor="middle" font-weight="bold">提示词  ·  可直接复制</text>
<text x="80.0" y="265.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">【幂等规矩】这一步很重要：</text>
<text x="80.0" y="284.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">如果你发现这个文档里已经存在“本周结论”这个一级标题，</text>
<rect x="70.0" y="288.0" width="860.0" height="21.0" rx="4" fill="#3A2E1C" stroke="#3A2E1C" stroke-width="0"/>
<rect x="70.0" y="288.0" width="3.0" height="21.0" rx="0" fill="#E0A95C" stroke="#E0A95C" stroke-width="0"/>
<text x="80.0" y="303.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#E0A95C" text-anchor="start" font-weight="bold">说明上一轮已经写过，不许再写一遍造成重复。</text>
<text x="80.0" y="322.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">立刻停下告诉我：文档里已有哪些一级标题，等我决定是覆盖还是追加。</text>
<text x="80.0" y="341.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal"></text>
<text x="80.0" y="360.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">【格式规矩】</text>
<rect x="70.0" y="364.0" width="860.0" height="21.0" rx="4" fill="#3A2E1C" stroke="#3A2E1C" stroke-width="0"/>
<rect x="70.0" y="364.0" width="3.0" height="21.0" rx="0" fill="#E0A95C" stroke="#E0A95C" stroke-width="0"/>
<text x="80.0" y="379.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#E0A95C" text-anchor="start" font-weight="bold">1. 一级标题用文档的一级标题样式，不许靠加粗来冒充标题。</text>
<rect x="70.0" y="383.0" width="860.0" height="21.0" rx="4" fill="#3A2E1C" stroke="#3A2E1C" stroke-width="0"/>
<rect x="70.0" y="383.0" width="3.0" height="21.0" rx="0" fill="#E0A95C" stroke="#E0A95C" stroke-width="0"/>
<text x="80.0" y="398.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#E0A95C" text-anchor="start" font-weight="bold">2. 表格用文档的原生表格，不许靠敲空格排成表格的样子。</text>
<text x="80.0" y="417.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">3. 全篇不许出现“暂无”“待补充”这类占位词。某个数据真的没有，</text>
<text x="80.0" y="436.0" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">   就写“本周未测”，并单独列出来告诉我。</text>
</svg>