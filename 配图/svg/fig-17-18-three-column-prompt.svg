<text x="80.0" y="342.2" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">1. 不许改任何术语、用词、称呼</text>
<text x="80.0" y="361.2" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">2. 不许改任何表格样式、字体、边框、排版</text>
<text x="80.0" y="380.2" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">3. 不许新增任何章节、段落、说明</text>
<text x="80.0" y="399.2" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">4. 不许删除任何注释、脚注、附录</text>
<text x="80.0" y="418.2" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal">5. 不许碰白名单之外的任何文件</text>
<text x="80.0" y="437.2" font-family="Consolas, Menlo, Courier New, monospace" font-size="13" fill="#D8DCE2" text-anchor="start" font-weight="normal"></text>
