<text x="120.0" y="372.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#6B7280" text-anchor="start" font-weight="normal">电器面板上的按钮。一个工具就是一件事，比如新建一个零件、读体积</text>
