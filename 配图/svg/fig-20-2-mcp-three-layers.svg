<text x="120.0" y="170.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" fill="#1C2026" text-anchor="start" font-weight="bold">第一层 客户端 client</text>
<text x="120.0" y="192.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#6B7280" text-anchor="start" font-weight="normal">插头那一侧。把 AI 的话变成一条符合规矩的请求，发出去等回包</text>
<rect x="90.0" y="230.0" width="820.0" height="78.0" rx="10" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="1.5"/>
<rect x="90.0" y="230.0" width="8.0" height="78.0" rx="4" fill="#6B7280" stroke="#6B7280" stroke-width="0"/>
<text x="120.0" y="260.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" fill="#1C2026" text-anchor="start" font-weight="bold">第二层 服务端 server</text>
<text x="120.0" y="282.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#6B7280" text-anchor="start" font-weight="normal">电器那一侧。开机时把自己有哪些工具报给客户端，收到调用时翻译成软件能听的动作</text>
<rect x="90.0" y="320.0" width="820.0" height="78.0" rx="10" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="1.5"/>
