<text x="56.0" y="58.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="27" fill="#1C2026" text-anchor="start" font-weight="bold">MCP 三层：插头、电器、按钮</text>
<text x="56.0" y="88.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#6B7280" text-anchor="start" font-weight="normal">客户端发请求，服务端做翻译，工具真正动手</text>
<line x1="56" y1="106" x2="944" y2="106" stroke="#E5E1DA" stroke-width="1.5"/>
<text x="56.0" y="616.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#6B7280" text-anchor="start" font-weight="normal">插头不认识按钮，按钮也不认识插头，两边各自按规矩做事</text>
<rect x="90.0" y="140.0" width="820.0" height="78.0" rx="10" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="1.5"/>
